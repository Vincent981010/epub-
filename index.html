<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>EPUB 繁體轉換工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-group { display: flex; gap: 15px; margin-bottom: 20px; }
        .btn-wrapper { flex: 1; text-align: center; }
        .btn-wrapper label { display: block; background: #007bff; color: white; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; box-shadow: 0 2px 4px rgba(0,123,255,0.2); }
        .btn-wrapper label:hover { background: #0056b3; }
        .btn-wrapper input[type="file"] { display: none; }
        .btn-wrapper .hint { font-size: 12px; color: #666; margin-top: 5px; display: block; }
        #log { background: #333; color: #0f0; padding: 12px; height: 380px; overflow-y: auto; font-family: monospace; font-size: 13px; line-height: 1.5; border-radius: 6px; }
    </style>
</head>
<body>
<div class="container">
    <h3>EPUB 繁體轉換</h3>
    
    <div class="btn-group">
        <div class="btn-wrapper">
            <label for="fileInput">📄 選擇多個檔案</label>
            <input type="file" id="fileInput" accept=".epub" multiple>
            <span class="hint">直接下載個別繁體書</span>
        </div>
        <div class="btn-wrapper">
            <label for="folderInput" style="background: #28a745; box-shadow: 0 2px 4px rgba(40,167,69,0.2);">📂 選擇整個資料夾</label>
            <input type="file" id="folderInput" webkitdirectory directory multiple>
            <span class="hint">包含子資料夾，打包成結構壓縮檔</span>
        </div>
    </div>

    <div id="log">系統準備就緒... (請選擇上方功能開始轉換)</div>
</div>

<script>
    const logEl = document.getElementById('log');
    function log(m) { logEl.innerText += '\n' + m; logEl.scrollTop = logEl.scrollHeight; }

    // 核心正則表達式
    const urlPattern = /([a-zA-Z0-9_:-]*(?:href|src))\s*=\s*(['"])(.*?)\2/gi;
    const xmlEncPattern = /(<\?xml[^>]+encoding\s*=\s*['"])[a-zA-Z0-9\-]+(['"])/gi;
    const metaEncPattern = /(<meta[^>]+charset\s*=\s*['"]?)[a-zA-Z0-9\-]+(['"]?)/gi;

    // 通用 EPUB 核心轉換邏輯 (完全保留原本成功的解碼與轉換機制)
    async function processSingleEpub(file, converter) {
        const zip = await new JSZip().loadAsync(file);
        const newZip = new JSZip();

        if (zip.files['mimetype']) {
            const mimeContent = await zip.file('mimetype').async('string');
            newZip.file('mimetype', mimeContent);
        }

        for (const [path, entry] of Object.entries(zip.files)) {
            if (entry.dir || path === 'mimetype') continue;

            const isTextFile = path.match(/\.(html|xhtml|htm|ncx|opf|xml|txt|css)$/i);
            const newPath = converter(path);

            if (isTextFile) {
                let content = await entry.async("string");

                content = content.replace(urlPattern, (match, attr, quote, urlVal) => {
                    try {
                        return `${attr}=${quote}${decodeURIComponent(urlVal)}${quote}`;
                    } catch (err) {
                        return match;
                    }
                });

                content = converter(content);

                content = content.replace(xmlEncPattern, "$1utf-8$2");
                content = content.replace(metaEncPattern, "$1utf-8$2");

                newZip.file(newPath, content);
            } else {
                newZip.file(newPath, await entry.async("blob"));
            }
        }

        return await newZip.generateAsync({ type: "blob", mimeType: "application/epub+zip" });
    }

    // 檢查 OpenCC 是否就緒
    function checkOpenCC() {
        if (typeof OpenCC === 'undefined') {
            log("❌ 錯誤：OpenCC 尚未載入，請稍後再試或檢查網路連線。");
            return null;
        }
        return OpenCC.Converter({ from: 'cn', to: 'twp' });
    }

    // 【模式一：多檔案選取處理】
    document.getElementById('fileInput').onchange = async (e) => {
        const converter = checkOpenCC();
        if (!converter) return;

        const files = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.epub'));
        if (files.length === 0) {
            log("❌ 未選取任何 .epub 檔案。");
            return;
        }

        log("==================================================");
        log(`🚀 開始批次轉換 ${files.length} 本獨立檔案...`);
        log("==================================================");

        for (const file of files) {
            log(`🚀 正在處理: ${file.name}`);
            try {
                const convertedBlob = await processSingleEpub(file, converter);
                const translatedFileName = converter(file.name);
                
                const a = document.createElement('a');
                a.href = URL.createObjectURL(convertedBlob);
                a.download = translatedFileName;
                a.click();
                log(`🎉 轉換完成！已下載: ${translatedFileName}`);
            } catch (err) {
                log(`❌ 轉換失敗: ${file.name} (${err.message})`);
                console.error(err);
            }
            log("--------------------------------------------------");
        }
        log("✅ 所有獨立檔案處理完畢。");
    };

    // 【模式二：整個資料夾深度遞迴處理】
    document.getElementById('folderInput').onchange = async (e) => {
        const converter = checkOpenCC();
        if (!converter) return;

        const allFiles = Array.from(e.target.files);
        const epubFiles = allFiles.filter(f => f.name.toLowerCase().endsWith('.epub'));

        if (epubFiles.length === 0) {
            log("❌ 在選取的資料夾及其子目錄中找不到任何 .epub 檔案。");
            return;
        }

        // 解析根資料夾名稱並翻譯，加上 _TW 作為輸出的目錄
        const firstPath = epubFiles[0].webkitRelativePath;
        const rootFolderName = firstPath.split('/')[0] || "EPUB_Folder";
        const translatedRootName = converter(rootFolderName) + "_TW";

        log("==================================================");
        log(`📂 偵測到資料夾結構，共有 ${epubFiles.length} 本 EPUB 檔案。`);
        log(`📦 系統將自動打包並維持原完整目錄結構至：${translatedRootName}.zip`);
        log("==================================================");

        const masterZip = new JSZip();

        for (const file of epubFiles) {
            // file.webkitRelativePath 格式為 "原資料夾/子資料夾/書名.epub"
            const relPath = file.webkitRelativePath;
            
            // 拆解路徑，將最外層改為對應的繁體輸出資料夾，其餘路徑及檔名皆轉為繁體
            const pathParts = relPath.split('/');
            pathParts[0] = translatedRootName; 
            for (let i = 1; i < pathParts.length; i++) {
                pathParts[i] = converter(pathParts[i]);
            }
            const translatedRelPath = pathParts.join('/');

            log(`🚀 深度處理中: ${relPath}`);
            try {
                // 執行轉換並取得個別 EPUB 的 Blob
                const convertedBlob = await processSingleEpub(file, converter);
                
                // 將轉換後的 EPUB 塞入總壓縮檔內對應的相對路徑中位置
                masterZip.file(translatedRelPath, convertedBlob);
                log(`✅ 已排入壓縮包結構: ${translatedRelPath}`);
            } catch (err) {
                log(`❌ 轉換失敗: ${relPath} (${err.message})`);
                console.error(err);
            }
            log("--------------------------------------------------");
        }

        log("📦 正在將所有轉換後的結構封裝至壓縮檔中，請稍候...");
        try {
            const masterBlob = await masterZip.generateAsync({ type: "blob" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(masterBlob);
            a.download = `${translatedRootName}.zip`;
            a.click();
            log(`🎉 【全部轉換完成】已成功下載完整結構壓縮包：${translatedRootName}.zip`);
        } catch (err) {
            log(`❌ 壓縮檔封裝失敗: ${err.message}`);
        }
        log("==================================================");
    };
</script>
</body>
</html>
