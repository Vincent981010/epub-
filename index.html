<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>EPUB 繁體轉換 (穩健版)</title>
    <script src="jszip.min.js"></script>
    <script src="opencc-js.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        #log { background: #333; color: #0f0; padding: 10px; height: 300px; overflow-y: auto; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h3>EPUB 內容繁體化 (不改路徑版)</h3>
    <input type="file" id="fileInput" accept=".epub" multiple>
    <div id="log">系統準備就緒...</div>
</div>

<script>
    const logEl = document.getElementById('log');
    function log(m) { logEl.innerText += '\n' + m; logEl.scrollTop = logEl.scrollHeight; }
    const converter = OpenCC.Converter({ from: 'cn', to: 'twp' });

    document.getElementById('fileInput').onchange = async (e) => {
        for (const file of e.target.files) {
            log("正在轉換內容: " + file.name);
            try {
                const zip = await new JSZip().loadAsync(file);
                const newZip = new JSZip();

                // 遍歷所有檔案
                for (const [path, entry] of Object.entries(zip.files)) {
                    if (entry.dir) {
                        newZip.folder(path);
                        continue;
                    }

                    // 重點：只轉換內容，保留原始路徑名稱 (path)
                    if (path.match(/\.(html|xhtml|xml|ncx|opf|txt|css|js)$/)) {
                        let content = await entry.async("string");
                        newZip.file(path, converter(content)); // 路徑不變，只轉內容
                    } else {
                        newZip.file(path, await entry.async("blob"));
                    }
                }
                
                const blob = await newZip.generateAsync({ type: "blob" });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "TW_" + file.name; // 只有輸出的檔名加字，內部路徑不動
                a.click();
                log("✅ 轉換完成: " + file.name);
            } catch (err) {
                log("❌ 錯誤: " + err.message);
            }
        }
    };
</script>
</body>
</html>
