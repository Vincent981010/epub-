<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>EPUB 繁體化工具 (結構穩固版)</title>
    <script src="jszip.min.js"></script>
    <script src="opencc-js.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        #log { background: #333; color: #0f0; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>
<div class="container">
    <h3>EPUB 繁體化 (保留路徑結構)</h3>
    <input type="file" id="fileInput" accept=".epub" multiple>
    <div id="log">系統準備就緒...</div>
</div>

<script>
    const logEl = document.getElementById('log');
    function log(m) { logEl.innerText += '\n' + m; logEl.scrollTop = logEl.scrollHeight; }
    
    // 初始化轉換引擎
    const converter = OpenCC.Converter({ from: 'cn', to: 'twp' });

    document.getElementById('fileInput').onchange = async (e) => {
        for (const file of e.target.files) {
            log("正在處理: " + file.name);
            try {
                const zip = await new JSZip().loadAsync(file);
                const newZip = new JSZip();
                
                // 遍歷所有檔案
                for (const [path, entry] of Object.entries(zip.files)) {
                    if (entry.dir) {
                        newZip.folder(path);
                        continue;
                    }
                    
                    // 關鍵邏輯：
                    // 1. 判斷是否為文字相關檔案 (html, xml, ncx, opf 等)
                    // 2. 轉換內容，但「檔名 (path)」保持原本的樣子，絕對不改名！
                    if (path.match(/\.(html|xhtml|xml|ncx|opf|txt|css|js)$/)) {
                        const content = await entry.async("string");
                        newZip.file(path, converter(content)); 
                    } else {
                        // 圖片等非文字檔直接複製，不改名也不轉換
                        newZip.file(path, await entry.async("blob"));
                    }
                }
                
                const blob = await newZip.generateAsync({ type: "blob" });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                
                // 這裡我們直接對最終輸出的檔名進行繁體化，讓它看起來像繁體書
                a.download = converter(file.name); 
                a.click();
                
                log("✅ 成功 (已保留結構): " + converter(file.name));
            } catch (err) {
                log("❌ 轉換失敗: " + err.message);
            }
        }
    };
</script>
</body>
</html>
