<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>EPUB 繁體轉換工具 (絕對穩定版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        #log { background: #333; color: #0f0; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h3>EPUB 繁體化 (不改檔名，確保目錄正常)</h3>
    <input type="file" id="fileInput" accept=".epub" multiple>
    <div id="log">系統準備就緒...</div>
</div>

<script>
    const logEl = document.getElementById('log');
    function log(m) { logEl.innerText += '\n' + m; logEl.scrollTop = logEl.scrollHeight; }
    
    // 初始化轉換引擎 (簡體轉繁體)
    const converter = OpenCC.Converter({ from: 'cn', to: 'twp' });

    document.getElementById('fileInput').onchange = async (e) => {
        for (const file of e.target.files) {
            log("正在處理: " + file.name);
            try {
                const zip = await new JSZip().loadAsync(file);
                const newZip = new JSZip();
                
                // 遍歷所有檔案
                for (const [path, entry] of Object.entries(zip.files)) {
                    if (entry.dir) {
                        newZip.folder(path);
                        continue;
                    }
                    
                    // 判斷是否為文字相關檔案 (才進行內容轉換)
                    // 絕不修改 path (檔名)
                    const isText = path.match(/\.(html|xhtml|xml|ncx|opf|txt|css|js|plist)$/i);
                    
                    if (isText) {
                        // 讀取內容並轉換
                        const content = await entry.async("string");
                        newZip.file(path, converter(content));
                    } else {
                        // 非文字檔 (圖片、字體) 原封不動拷貝
                        newZip.file(path, await entry.async("blob"));
                    }
                }
                
                // 產生檔案
                const blob = await newZip.generateAsync({ type: "blob" });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "繁體_" + file.name; // 僅輸出時改檔名，不影響內部
                a.click();
                log("✅ 成功: " + file.name);
            } catch (err) {
                log("❌ 錯誤: " + err.message);
                console.error(err);
            }
        }
    };
</script>
</body>
</html>
