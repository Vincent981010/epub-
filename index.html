<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB 簡繁轉換工具</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <script src="https://unpkg.com/opencc-js@1.0.5/dist/umd/opencc-js.min.js"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f7f9fc; color: #333; margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 30px; }
        .drop-zone { border: 2px dashed #3498db; border-radius: 12px; padding: 40px 20px; text-align: center; background: #f0f8ff; margin-bottom: 20px; }
        .btn-group { display: flex; justify-content: center; gap: 15px; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
        input[type="file"] { display: none; }
        .log-container { background: #1e1e1e; border-radius: 8px; padding: 15px; margin-top: 20px; height: 300px; overflow-y: auto; }
        #log { margin: 0; color: #a9b7c6; font-family: monospace; font-size: 14px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 EPUB 批次繁體轉換工具</h1>
    <div class="drop-zone" id="dropZone">
        <div class="btn-group">
            <button onclick="document.getElementById('fileInput').click()">📂 選擇檔案</button>
            <button onclick="document.getElementById('folderInput').click()">📁 選擇資料夾</button>
        </div>
        <input type="file" id="fileInput" accept=".epub" multiple>
        <input type="file" id="folderInput" accept=".epub" webkitdirectory directory multiple>
    </div>
    <div class="log-container">
        <pre id="log">系統準備就緒...\n</pre>
    </div>
</div>

<script>
    const logEl = document.getElementById('log');
    function addLog(msg) { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; }

    // 檢查 OpenCC 是否載入成功
    window.onload = function() {
        if (typeof OpenCC === 'undefined') {
            addLog("❌ 錯誤：OpenCC 轉換引擎載入失敗，請檢查網路連線後重整頁面。");
        } else {
            addLog("✅ 系統已就緒。");
        }
    };

    const converter = OpenCC.Converter({ from: 'cn', to: 'twp' });

    async function handleFiles(files) {
        const epubFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.epub'));
        for (const file of epubFiles) {
            addLog(`處理中: ${file.name}`);
            try {
                const zip = new JSZip();
                await zip.loadAsync(file);
                const newZip = new JSZip();
                
                for (const relativePath in zip.files) {
                    const zipEntry = zip.files[relativePath];
                    if (zipEntry.dir) continue;
                    
                    const newPath = converter(relativePath);
                    const ext = relativePath.split('.').pop().toLowerCase();
                    
                    if (['html', 'xhtml', 'htm', 'ncx', 'opf', 'xml', 'txt', 'css'].includes(ext)) {
                        const content = await zipEntry.async("string");
                        newZip.file(newPath, converter(content));
                    } else {
                        newZip.file(newPath, await zipEntry.async("blob"));
                    }
                }
                const blob = await newZip.generateAsync({ type: "blob" });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = converter(file.name.replace('.epub', '')) + '_TW.epub';
                a.click();
                addLog(`-> ✅ 完成`);
            } catch (e) {
                addLog(`-> ❌ 錯誤: ${e.message}`);
            }
        }
    }

    document.getElementById('fileInput').addEventListener('change', e => handleFiles(e.target.files));
    document.getElementById('folderInput').addEventListener('change', e => handleFiles(e.target.files));
</script>

</body>
</html>
