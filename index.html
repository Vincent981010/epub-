<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>EPUB 繁體轉換器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #log { background: #333; color: #0f0; padding: 10px; height: 350px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h3>EPUB 繁體轉換 (完全對齊 Python 邏輯)</h3>
    <input type="file" id="fileInput" accept=".epub" multiple>
    <div id="log">系統準備就緒...</div>
</div>

<script>
    const logEl = document.getElementById('log');
    function log(m) { logEl.innerText += '\n' + m; logEl.scrollTop = logEl.scrollHeight; }
    const converter = OpenCC.Converter({ from: 'cn', to: 'twp' });

    document.getElementById('fileInput').onchange = async (e) => {
        for (const file of e.target.files) {
            log("🚀 啟動深度轉換: " + file.name);
            try {
                const zip = await new JSZip().loadAsync(file);
                const newZip = new JSZip();
                
                // 1. 建立完整路徑映射表 (Old Path -> New Path)
                const pathMap = new Map();
                zip.forEach((path) => {
                    pathMap.set(path, converter(path));
                });

                // 2. 開始轉換檔案
                for (const [oldPath, entry] of Object.entries(zip.files)) {
                    if (entry.dir) continue;
                    
                    const newPath = pathMap.get(oldPath);
                    const isTextFile = oldPath.match(/\.(html|xhtml|xml|ncx|opf|txt|css|js|plist)$/i);

                    if (isTextFile) {
                        let content = await entry.async("string");
                        
                        // 先將內容本身的字體轉繁體
                        let newContent = converter(content);

                        // 核心：全域替換連結 (取代路徑)
                        // 依照路徑長度排序，確保替換時不會發生部分取代錯誤
                        const sortedPaths = Array.from(pathMap.entries()).sort((a, b) => b[0].length - a[0].length);
                        
                        for (const [oP, nP] of sortedPaths) {
                            // 替換一般連結
                            newContent = newContent.split(oP).join(nP);
                            // 替換編碼過的 URL 連結 (例如 %E7%AC%AC...)
                            newContent = newContent.split(encodeURI(oP)).join(encodeURI(nP));
                        }
                        
                        newZip.file(newPath, newContent);
                    } else {
                        // 非文字檔，只更名，不轉換內容
                        newZip.file(newPath, await entry.async("blob"));
                    }
                }
                
                const blob = await newZip.generateAsync({ type: "blob" });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = converter(file.name);
                a.click();
                log("✅ 成功轉存: " + converter(file.name));
            } catch (err) {
                log("❌ 發生嚴重錯誤: " + err.message);
                console.error(err);
            }
        }
    };
</script>
</body>
</html>
