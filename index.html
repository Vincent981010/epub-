<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB 簡繁轉換工具 (純網頁永久免費版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/opencc-js.min.js"></script>
    
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f7f9fc; color: #333; margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 14px; }
        
        .drop-zone { border: 2px dashed #3498db; border-radius: 12px; padding: 40px 20px; text-align: center; background: #f0f8ff; transition: all 0.3s ease; margin-bottom: 20px; }
        .drop-zone.dragover { background: #e1f0fa; border-color: #2980b9; }
        .drop-zone p { margin: 0 0 15px 0; font-size: 16px; color: #2980b9; font-weight: bold; }
        
        .btn-group { display: flex; justify-content: center; gap: 15px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #2980b9; }
        
        /* 隱藏原生 input */
        input[type="file"] { display: none; }
        
        .log-container { background: #1e1e1e; border-radius: 8px; padding: 15px; margin-top: 20px; height: 300px; overflow-y: auto; }
        #log { margin: 0; color: #a9b7c6; font-family: "Consolas", monospace; font-size: 14px; white-space: pre-wrap; line-height: 1.5; }
        .log-success { color: #43a047; }
        .log-warn { color: #f39c12; }
        .log-error { color: #e74c3c; }
        .log-info { color: #3498db; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 EPUB 批次繁體轉換工具</h1>
    <p class="subtitle">XML 安全修復 / 不掉頁版 (純本地運算，檔案不會上傳至伺服器)</p>

    <div class="drop-zone" id="dropZone">
        <p>將 EPUB 檔案或資料夾拖曳至此處，或使用下方按鈕選擇</p>
        <div class="btn-group">
            <button onclick="document.getElementById('fileInput').click()">📂 選擇檔案</button>
            <button onclick="document.getElementById('folderInput').click()">📁 選擇資料夾</button>
        </div>
        
        <input type="file" id="fileInput" accept=".epub" multiple>
        <input type="file" id="folderInput" accept=".epub" webkitdirectory directory multiple>
    </div>

    <div class="log-container">
        <pre id="log">系統準備就緒。等待載入檔案...\n</pre>
    </div>
</div>

<script>
    // ==========================================
    // 1. 初始化環境與 UI 綁定
    // ==========================================
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const folderInput = document.getElementById('folderInput');
    const logEl = document.getElementById('log');
    
    // 初始化 OpenCC (s2twp: 簡體到繁體，包含台灣慣用語)
    const converter = OpenCC.Converter({ from: 'cn', to: 'twp' });
    
    function addLog(msg, type = '') {
        const span = document.createElement('span');
        span.className = type ? `log-${type}` : '';
        span.textContent = msg + '\n';
        logEl.appendChild(span);
        logEl.scrollTop = logEl.scrollHeight;
    }

    // 拖曳事件處理
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        
        // 抓取拖曳進來的所有檔案 (包含資料夾內的檔案展開)
        if (e.dataTransfer.items) {
            let files = [];
            let promises = [];
            
            for (let i = 0; i < e.dataTransfer.items.length; i++) {
                let item = e.dataTransfer.items[i].webkitGetAsEntry();
                if (item) {
                    promises.push(traverseFileTree(item, files));
                }
            }
            
            Promise.all(promises).then(() => {
                handleFiles(files);
            });
        }
    });

    // 遞迴讀取資料夾內的檔案
    function traverseFileTree(item, files) {
        return new Promise((resolve) => {
            if (item.isFile) {
                item.file(file => {
                    files.push(file);
                    resolve();
                });
            } else if (item.isDirectory) {
                let dirReader = item.createReader();
                dirReader.readEntries(entries => {
                    let promises = [];
                    for (let i = 0; i < entries.length; i++) {
                        promises.push(traverseFileTree(entries[i], files));
                    }
                    Promise.all(promises).then(resolve);
                });
            }
        });
    }

    // 按鈕選擇事件處理
    const onFileSelect = (e) => {
        if (e.target.files.length > 0) {
            handleFiles(Array.from(e.target.files));
        }
        e.target.value = ''; // 重置以允許重複選擇
    };
    fileInput.addEventListener('change', onFileSelect);
    folderInput.addEventListener('change', onFileSelect);

    // ==========================================
    // 2. 核心轉換邏輯
    // ==========================================
    async function handleFiles(files) {
        const epubFiles = files.filter(f => f.name.toLowerCase().endsWith('.epub'));
        
        if (epubFiles.length === 0) {
            addLog("❌ 找不到任何 .epub 檔案，請確認內容。", "error");
            return;
        }

        addLog(`\n🚀 找到 ${epubFiles.length} 本 EPUB，開始轉換...`, "info");
        addLog("-".repeat(50));

        for (let i = 0; i < epubFiles.length; i++) {
            await processEpub(epubFiles[i], i + 1, epubFiles.length);
        }
        
        addLog("-".repeat(50));
        addLog("🎉 所有檔案轉換完成！請檢查瀏覽器的下載紀錄。\n", "success");
    }

    async function processEpub(file, currentIndex, totalFiles) {
        addLog(`[${currentIndex}/${totalFiles}] 處理中: ${file.name}`);
        
        try {
            const zip = new JSZip();
            await zip.loadAsync(file);
            const newZip = new JSZip();
            
            const targetExts = ['.html', '.xhtml', '.htm', '.ncx', '.opf', '.xml', '.txt', '.css'];
            
            const urlPattern = /([a-zA-Z0-9_:-]*(?:href|src))\s*=\s*(['"])(.*?)\2/gi;
            const xmlEncPattern = /(<\?xml[^>]+encoding\s*=\s*['"])[a-zA-Z0-9\-]+(['"])/gi;
            const metaEncPattern = /(<meta[^>]+charset\s*=\s*['"]?)[a-zA-Z0-9\-]+(['"]?)/gi;

            for (const relativePath in zip.files) {
                const zipEntry = zip.files[relativePath];
                if (zipEntry.dir) continue;

                const ext = relativePath.substring(relativePath.lastIndexOf('.')).toLowerCase();
                const newPath = converter(relativePath);

                if (relativePath === 'mimetype') {
                    const data = await zipEntry.async("uint8array");
                    newZip.file(newPath, data); 
                    continue;
                }

                if (targetExts.includes(ext)) {
                    const uint8Data = await zipEntry.async("uint8array");
                    let content = null;
                    
                    try { content = new TextDecoder('utf-8', { fatal: true }).decode(uint8Data); } 
                    catch (e1) {
                        try { content = new TextDecoder('gb18030', { fatal: true }).decode(uint8Data); } 
                        catch (e2) { content = new TextDecoder('utf-8', { fatal: false }).decode(uint8Data); }
                    }

                    if (content !== null) {
                        if (['.opf', '.ncx', '.html', '.xhtml', '.htm', '.xml'].includes(ext)) {
                            content = content.replace(urlPattern, (match, p1, p2, p3) => {
                                try { return `${p1}=${p2}${decodeURIComponent(p3)}${p2}`; } 
                                catch(e) { return match; }
                            });
                        }

                        content = converter(content);
                        content = content.replace(xmlEncPattern, '$1utf-8$2');
                        content = content.replace(metaEncPattern, '$1utf-8$2');

                        newZip.file(newPath, content);
                    }
                } else {
                    const data = await zipEntry.async("uint8array");
                    newZip.file(newPath, data);
                }
            }

            const blob = await newZip.generateAsync({ type: "blob", compression: "DEFLATE" });
            
            // 轉換檔名並觸發下載
            const originalName = file.name.substring(0, file.name.lastIndexOf('.'));
            const newFilename = converter(originalName) + '_TW.epub';
            downloadFile(blob, newFilename);
            
            addLog(`  -> ✅ 成功: 下載為 ${newFilename}`, "success");
            
        } catch (error) {
            addLog(`  -> ❌ 失敗: ${error.message}`, "error");
            console.error(error);
        }
    }

    function downloadFile(blob, filename) {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        
        // 清理記憶體
        setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }, 100);
    }
</script>

</body>
</html>
